name: Schema Description Review - Comment

on:
  workflow_run:
    workflows: ["Schema Description Review - Prepare"]
    types: [completed]

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    name: Post description review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install anthropic==1.7.0

      # The artifact is built by an unprivileged job running untrusted PR code,
      # so its contents are attacker-controlled. Download it under RUNNER_TEMP,
      # never the workspace: extracting into the workspace would let a crafted
      # artifact overwrite the checked-out review script that the privileged
      # step below executes.
      - name: Download review context
        uses: actions/download-artifact@v8
        with:
          name: review-context
          path: ${{ runner.temp }}/review-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Review and comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ZACHS_CLAUDE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_CONTEXT_DIR: ${{ runner.temp }}/review-artifact
          # Trusted value from the workflow_run event, used to confirm the
          # PR number inside the artifact really belongs to this run.
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python .github/scripts/review_descriptions.py review

      - name: Report review failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_CONTEXT_DIR: ${{ runner.temp }}/review-artifact
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python .github/scripts/review_descriptions.py report-failure
