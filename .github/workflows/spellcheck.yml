name: Spellcheck

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # On a pull request, cspell checks only the files it changes.
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v9
        with:
          config: .github/.cspell.yaml
          # Advisory only. Unknown words are annotations; they do not fail the job.
          strict: false
          inline: warning
